name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==================== macOS 构建 ====================
  build-macos:
    name: Build macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        working-directory: platforms/macos
        run: |
          swift --version
          xcrun --show-sdk-path
          ls -la

      - name: Build .app
        working-directory: platforms/macos
        run: |
          set -euxo pipefail
          # 清理
          rm -rf MiniMail MiniMail.app MiniMail-dmg MiniMail-Installer.dmg
          # 编译
          swiftc -O -parse-as-library -framework Cocoa -framework WebKit -framework SwiftUI \
            MiniMail.swift \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist \
            -o MiniMail
          # 验证可执行文件
          ls -la MiniMail
          file MiniMail
          # 打包 .app
          mkdir -p MiniMail.app/Contents/MacOS
          mkdir -p MiniMail.app/Contents/Resources
          cp MiniMail MiniMail.app/Contents/MacOS/
          cp Info.plist MiniMail.app/Contents/
          cp AppIcon.icns MiniMail.app/Contents/Resources/
          /usr/bin/plutil -replace CFBundleDisplayName -string "MiniMail" MiniMail.app/Contents/Info.plist
          /usr/bin/plutil -replace CFBundleIconFile -string "AppIcon" MiniMail.app/Contents/Info.plist
          # 验证
          find MiniMail.app -type f
          du -sh MiniMail.app

      - name: Smoke test (启动 5 秒看是否崩溃)
        working-directory: platforms/macos
        run: |
          set -euxo pipefail
          # 后台启动应用
          ./MiniMail.app/Contents/MacOS/MiniMail > /tmp/MiniMail_smoke.log 2>&1 &
          APP_PID=$!
          echo "Started MiniMail with PID=$APP_PID"
          # 等待 5 秒
          sleep 5
          # 检查进程是否还活着
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ App still running after 5s"
            kill $APP_PID || true
            sleep 1
            kill -9 $APP_PID 2>/dev/null || true
          else
            echo "✗ App crashed within 5s"
            echo "--- Smoke test log ---"
            cat /tmp/MiniMail_smoke.log
            echo "--- End log ---"
            exit 1
          fi
          echo "--- Smoke test log (clean shutdown) ---"
          cat /tmp/MiniMail_smoke.log
          echo "--- End ---"

      - name: Package DMG
        working-directory: platforms/macos
        run: |
          set -euxo pipefail
          make dmg
          ls -la MiniMail-Installer.dmg
          du -sh MiniMail-Installer.dmg

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMail-macOS-app
          path: platforms/macos/MiniMail.app
          if-no-files-found: error
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMail-macOS-dmg
          path: platforms/macos/MiniMail-Installer.dmg
          if-no-files-found: error
          retention-days: 30

      # 失败时打开 tmate 调试会话
      - name: Setup tmate for debugging
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: false

  # ==================== Windows 构建 ====================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platforms/windows/package-lock.json

      - name: Install dependencies
        working-directory: platforms/windows
        run: npm install

      - name: Build NSIS + Portable
        working-directory: platforms/windows
        env:
          # 加速 Electron 下载（可选）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: MiniMail-Windows-Setup
          path: platforms/windows/dist/小邮箱 Setup *.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MiniMail-Windows-Portable
          path: platforms/windows/dist/MiniMail-Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked
        uses: actions/upload-artifact@v4
        with:
          name: MiniMail-Windows-unpacked
          path: platforms/windows/dist/win-unpacked
          if-no-files-found: error
          retention-days: 30
